version: '3'
# Calculator service
services:
  app:
    build: .
    image: kaushi11/calculator:1
    # image: australia-southeast2-docker.pkg.dev/sit737-25t1-dona-3ac918c/calculator/cal:1
    ports:
      - "3041:3041"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=3041
      # - MONGO_URI=mongodb://mongo:27017/calculator
      - MONGO_URI=mongodb://admin:password@mongo:27017/calculator?authSource=admin
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 30s
      timeout: 5s
      retries: 3

# Mongo service
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:

