version: '3'
services:
  app:
    build: .
    # image: kaushi11/texttoolkit:1
    image: australia-southeast2-docker.pkg.dev/text-toolkit-460514/text-toolkit-repo/text-toolkit:1
    depends_on:
      - mongo
    ports:
      - "3041:3041"
    environment:
      # - MONGO_URI=mongodb://mongo:27017/texttoolkit
      - PORT=3041
      - MONGO_URI=mongodb://admin:password@mongo:27017/texttoolkit?authSource=admin
      - SESSION_SECRET=mySuperSecretSessionKey
      - JWT_SECRET=your_super_secret_key
    restart: always

  mongo:
      image: mongo
      ports:
        - "27017:27017"
      environment:
        MONGO_INITDB_ROOT_USERNAME: admin
        MONGO_INITDB_ROOT_PASSWORD: password
      volumes:
        - mongo-data:/data/db
      restart: always
      healthcheck:
        test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
        interval: 30s
        timeout: 5s
        retries: 3

volumes:
  mongo-data:

