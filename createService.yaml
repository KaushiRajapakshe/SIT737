apiVersion: v1
kind: Service
metadata:
  name: mydeployment
spec:
  selector:
    app: mydeployment
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000

---

apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

