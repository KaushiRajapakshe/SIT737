apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  selector:
    app: myapp 
  # type: NodePort
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000
      # nodePort: 32005

---

apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017