<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register - Text Toolkit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-container">
      <!-- Login View -->
      <section id="login-view" class="auth-box">
        <h2>Login</h2>
        <form id="login-form">
          <input
            type="text"
            id="login-username"
            name="username"
            placeholder="Username"
            required
            minlength="3"
          />
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Password"
            required
            minlength="6"
          />
          <button type="submit">Login</button>
          <div id="login-error" class="error-message"></div>
        </form>
        <p class="switch-view">
          No account?
          <button type="button" id="show-register" class="link-button">
            Sign Up
          </button>
        </p>
      </section>

      <!-- Register View -->
      <section id="register-view" class="auth-box" style="display: none">
        <h2>Sign Up</h2>
        <form id="register-form">
          <input
            type="text"
            id="register-username"
            name="username"
            placeholder="Username"
            required
            minlength="3"
          />
          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="Password"
            required
            minlength="6"
          />
          <button type="submit">Register</button>
          <div id="register-error" class="error-message"></div>
        </form>
        <p class="switch-view">
          Already have an account?
          <button type="button" id="show-login" class="link-button">
            Login
          </button>
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
